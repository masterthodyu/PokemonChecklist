<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Squares</title>
    <style>
      :root {
        --bg: #f5f5f5;
        --square-a: #d9d9d9;
        --square-b: #bdbdbd;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
      }

      .canvas {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 32px;
        padding: 32px;
      }

      .square {
        width: 120px;
        height: 120px;
        border-radius: 8px;
        box-shadow: 0 10px 18px rgba(0, 0, 0, 0.08);
      }

      .square.one {
        background: var(--square-a);
      }

      .square.two {
        width: 90px;
        height: 90px;
        background: var(--square-b);
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="square one"></div>
      <div class="square two"></div>
    </div>
  </body>
</html>
